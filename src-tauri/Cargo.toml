[package]
name = "torrentplayer-app"
description = "Torrent X Player app shell (Tauri), for desktop and Android."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "torrentplayer_app"
# staticlib and cdylib are what the Android build links into the APK.
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "torrentplayer"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[target.'cfg(windows)'.build-dependencies]
# Already used by tauri-build; used directly to embed the manifest into test binaries too.
embed-resource = "3.0"

[dependencies]
anyhow.workspace = true
# Thumbnails reach the webview as data: URLs.
base64.workspace = true
bytes.workspace = true
torrentplayer-library.workspace = true
torrentplayer-net.workspace = true
torrentplayer-media.workspace = true
torrentplayer-prioritize.workspace = true
torrentplayer-search.workspace = true
torrentplayer-settings.workspace = true
torrentplayer-stream.workspace = true
torrentplayer-torrent.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
thiserror.workspace = true
# Runs the FFmpeg sidecar that converts Dolby and DTS audio.
tokio = { workspace = true, features = ["io-util", "process"] }
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs.workspace = true
url.workspace = true

# The system folder picker exists on desktops only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd.workspace = true

# Android: HTTPS certificates are checked by the system's verifier, set up through JNI at start
# (see `lib.rs`). All three are already in the build through reqwest and tao.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", default-features = false }
ndk-context = "0.1.1"
rustls-platform-verifier = "0.7.1"

[target.'cfg(windows)'.dependencies]
# Lowers WebView2's memory target while the window is minimized (see `window.rs`).
webview2-com.workspace = true
windows-core.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
